<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>

</head>
<body>

<main>
  <div>
    <picture class="signup__illustration">
      <source media="(min-width: 64em)" srcset="/assets/images/illustration-sign-up-desktop.svg"/>

      <source media="(min-width: 37.5em)" srcset="/assets/images/illustration-sign-up-tablet.svg"/>

      <img class="signup__image" src="/assets/images/illustration-sign-up-mobile.svg" alt="Description of the image"/>
    </picture>
  </div>

  <div class="signup__body">
    <h1 class="signup__title">Stay updated!</h1>
    <p class="signup__p">Join 60,000+ product managers receiving monthly updates on:</p>

    <div class="signup__table">
       <p><span><img src="/assets/images/icon-list.svg"></span>Product discovery and building what matters</p>
       <p><span><img src="/assets/images/icon-list.svg"></span>  Measuring to ensure updates are a success</p>
       <p><span><img src="/assets/images/icon-list.svg"></span>  And much more!</p>
    </div>

    <form class="signup__form">
      <div class="signup__form-group">
         <label for="email">Email address</label>
        <input name="email" type="email" id="email" placeholder="email@company.com">
      </div>
       
      <button type="submit" class="btn">Subscribe to monthly newsletter</button>
    </form>
  </div>
</main>





</body>
</html>
